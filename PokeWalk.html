<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11131a">
  <title>PokeWalk</title>
  <style>
    body {
      margin: 0;
      background: #11131a;
      color: #f0f4f8;
      font: 14px system-ui, sans-serif;
    }

    #startup {
      padding: 1rem;
      text-align: center;
    }
  </style>
</head>

<body>
  <main id="game-root">
    <p id="startup" role="status">Cargando PokeWalk…</p>
  </main>
  <script type="module">
    const root = document.getElementById("game-root");
    try {
      const { startGame } = await import("https://cdn.jsdelivr.net/gh/Juncal1422/Pokewalk@develop/js/main.js");
      await startGame({ root });
    } catch (error) {
      console.error(error);
      root.textContent = "No se pudo cargar PokeWalk. Recarga la página para volver a intentarlo.";
    }
  </script>
</body>

</html>
