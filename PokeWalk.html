<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11131a">
  <title>PokeWalk</title>
  <style>
    body {
      margin: 0;
      background: #11131a;
      color: #f0f4f8;
      font: 14px system-ui, sans-serif;
    }

    #startup {
      padding: 1rem;
      text-align: center;
    }
  </style>
</head>

<body>
  <main id="game-root">
    <p id="startup" role="status">Cargando PokeWalk…</p>
  </main>
  <script type="module">
    const root = document.getElementById("game-root");
    try {
      const response = await fetch("https://api.github.com/repos/Juncal1422/Pokewalk/branches/develop", { cache: "no-store" });
      if (!response.ok) throw new Error(`GitHub respondió con ${response.status}`);
      const { commit } = await response.json();
      if (!/^[0-9a-f]{40}$/.test(commit?.sha)) throw new Error("Referencia de develop inválida");
      const { startGame } = await import(`https://rawcdn.githack.com/Juncal1422/Pokewalk/${commit.sha}/js/main.js`);
      await startGame({ root });
    } catch (error) {
      console.error(error);
      root.textContent = "No se pudo cargar PokeWalk. Recarga la página para volver a intentarlo.";
    }
  </script>
</body>

</html>
