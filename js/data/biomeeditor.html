<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor de biomas · PokeWalk</title>
<style>
@font-face{font-family:Wondermail;src:url(../../assets/ui/wondermail.ttf)}*{box-sizing:border-box}body{margin:0;background:#13212d;color:#fff;font:clamp(14px,2.2vmin,24px) Wondermail;overflow:hidden}main{height:100dvh;display:grid;align-content:start;gap:1vh;padding:2vmin}h1{margin:0}header,section{display:flex;gap:1vmin;flex-wrap:wrap;align-items:center}button,select,input,textarea,fieldset{font:inherit;color:inherit;background:#1f3443 padding-box;border:5px solid transparent;border-image:url(../../assets/ui/textbox-b.png) 16 stretch}button{cursor:pointer}fieldset{display:grid;gap:1vh;min-width:0}label{display:grid;gap:3px}textarea{width:100%;height:min(20vh,10em);resize:none}output{color:#ffd781}#fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
</style>
<main><h1>Editor de biomas</h1><header><label>Abrir biomes.json<input id="file" type="file" accept=".json"></label><button id="download">Descargar biomes.json</button></header>
<section><label>Bioma<select id="biome"></select></label><label>Franja<select id="band"><option>1-8</option><option>9-16</option><option>17-25</option><option>26-36</option><option>37-50</option></select></label></section>
<fieldset><section><label>Nombre<input id="name"></label><label>Nivel<input id="level" type="number" min="1" max="10"></label><label>Terreno<select id="terrain"><option>wall</option><option>water</option><option>lava</option><option>void</option></select></label></section><label>Tileset<input id="tileset"></label>
<div id="fields"><label>Salvajes · uno por línea<textarea id="wild"></textarea></label><label>Líderes · uno por línea<textarea id="leaders"></textarea></label></div>
<label>Variantes, habilidades y distribución (JSON)<textarea id="extra"></textarea></label></fieldset><output id="status" aria-live="polite"></output></main>
<script type="module">
const field=id=>document.getElementById(id);
let catalog=[],index=0,band='1-8',species;
const bands=[...field('band').options].map(option=>option.value);
// Registra el borrador antes de navegar o exportar y conserva los campos adicionales.
function commit(){
  if(!catalog.length)throw Error('Abre biomes.json.');
  const row=structuredClone(catalog[index]),extra=JSON.parse(field('extra').value);
  for(const key of ['mediumFrequency','canCross','layoutModifier'])row[key]=extra[key];
  if(!Array.isArray(row.canCross)||!(row.mediumFrequency>=0 && row.mediumFrequency<=1)||!row.layoutModifier)throw Error('Comprueba los campos adicionales.');
  for(const key of ['name','terrain','tileset'])row[key]=field(key).value.trim();
  row.level=Number(field('level').value);
  if(!row.name||!row.tileset||!Number.isInteger(row.level)||row.level<1||row.level>10)throw Error('Comprueba el nombre, nivel y tileset.');
  for(const key of ['wild','leaders']){
    const names=[...new Set(field(key).value.split(/[\n,]/).map(n=>n.trim()).filter(Boolean))];
    const index=bands.indexOf(band);
    const count=row.level>5 && index<3?0:(key==='wild'?[7,6,6,5,5]:[4,4,3,3,2])[index];
    if(names.length!==count)throw Error('Se necesitan '+count+' especies en '+key+'.');
    if(names.some(n=>species&&!species.has(n)))throw Error('Lista vacía o especie desconocida.');
    row[key][band]=names;
  }
  catalog[index]=row;
}
// Pinta el bioma y la franja seleccionados después de validar el borrador anterior.
function render(){
  const row=catalog[index];field('biome').replaceChildren(...catalog.map((b,i)=>new Option(b.name,i)));field('biome').value=index;field('band').value=band;
  for(const key of ['name','level','terrain','tileset'])field(key).value=row[key];
  for(const key of ['wild','leaders'])field(key).value=row[key][band].join('\n');
  field('extra').value=JSON.stringify({mediumFrequency:row.mediumFrequency,canCross:row.canCross,layoutModifier:row.layoutModifier},null,2);
}
// Un archivo inválido no sustituye al catálogo que se está editando.
function openCatalog(rows){
  if(!Array.isArray(rows)||!rows.length||rows.some(row=>!row.name||bands.some(b=>!Array.isArray(row.wild?.[b])||!Array.isArray(row.leaders?.[b]))))throw Error('Catálogo de biomas inválido.');
  catalog=rows;index=0;band=bands[0];render();field('status').textContent='';
}
for(const id of ['band','biome'])field(id).onchange=()=>{try{commit();index=Number(field('biome').value);band=field('band').value;render();field('status').textContent='';}catch(error){field('biome').value=index;field('band').value=band;field('status').textContent=error.message;}};
field('file').onchange=async()=>{try{openCatalog(JSON.parse(await field('file').files[0].text()));}catch(error){field('status').textContent=error.message;}};
field('download').onclick=()=>{try{commit();const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([JSON.stringify(catalog,null,2)+'\n'],{type:'application/json'}));link.download='biomes.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);}catch(error){field('status').textContent=error.message;}};
try{openCatalog(await (await fetch('./biomes.json')).json());species=new Set((await (await fetch('./pokemon.json')).json()).map(row=>row.name));}catch{field('status').textContent='Selecciona biomes.json para editar desde disco.';}
</script></html>
